<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cvent Event Calendar</title>
  <link rel="stylesheet" href="CventStyle.css">
</head>
<body>
  <header>
    <h1>OSU Integrative Health Community Classes</h1>

  <div class="calendar-container">

      <button id="prevMonth">&#10094;</button>
      <h2 id="monthYear"></h2>

    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <script src="CventScript.js"></script>
</body>
</html>
